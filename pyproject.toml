[project]
name = "predictor-autoresearch"
version = "0.2.0"
description = "Bounded forecasting research policy with a governed FDE Kernel Provider boundary"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "plotly",
  "scikit-learn",
  "xgboost",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
frequency = ["tsfresh"]

[project.scripts]
predictor-autoresearch = "predictor_autoresearch.cli:main"
predictor-autoresearch-policy = "predictor_autoresearch.policy_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
